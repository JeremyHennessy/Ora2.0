name: Ora window close budget repair
on:
  push:
    branches: ['implementation/ora-window-close-budget-20261023']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Eleven new tail-budget and controller lifecycle regressions, no model calls
        run: python -B tests/test_ora_window_close_budget_v1.py
      - name: Ten existing controller failure and hold regressions
        run: python -B tests/test_ora_controller_v1.py
      - name: Six owned-model policy and failed-closure regressions, no model startup
        run: python -B tests/test_ora_owned_ollama_v1.py
      - name: Exact runtime source bytes
        run: python -B -c "import json,hashlib,pathlib; p=json.loads(pathlib.Path('data/ora-window-close-source-pins-v1.json').read_text()); assert all(hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==h for n,h in p.items()); print(len(p),'source hashes matched')"
