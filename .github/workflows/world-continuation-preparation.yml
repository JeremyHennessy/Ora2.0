name: World continuation preparation only
on:
  push:
    branches: ['implementation/bounded-world-continuation-prep-20261023']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data-only-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic source and admission refusal checks; no World or native execution
        run: python -B tests/test_pilot74_continuation_preflight_v1.py
      - name: Pin preparation source bytes
        run: sha256sum experiments/digital_pilot74_continuation_preflight_v1.py
