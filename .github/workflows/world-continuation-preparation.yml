name: World continuation preparation only
on:
  push:
    branches: ['implementation/bounded-world-continuation-prep-20261023', 'implementation/pilot74-exception-evidence-20261023', 'implementation/pilot74-durable-supervisor-20261023']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data-only-preflight:
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic source and admission refusal checks; no World or native execution
        run: python -B tests/test_pilot74_continuation_preflight_v1.py
      - name: New synthetic guardian exception evidence;no native launches
        run: python -B tests/test_pilot74_exception_evidence_v1.py
      - name: Exact prospective world source union without World imports
        run: python -B tests/check_pilot74_continuation_source_union_v1.py
      - name: Synthetic durable caller custody;zero native processes or Worlds
        run: python -B tests/test_pilot74_durable_supervisor_v1.py
      - name: Pin external caller and resource plan bytes
        run: python -B -c "import hashlib,pathlib;[(print(p,hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest())) for p in ['experiments/digital_pilot74_durable_supervisor_v1.py','experiments/digital_pilot74_outer_owner_v1.py','docs/PILOT74-RESOURCE-CUSTODY-QUALIFICATION-20261023.md']]"
      - name: Mocked enclosing owner Job and absolute deadline;zero native launches
        run: python -B tests/test_pilot74_outer_owner_v1.py
      - name: Pin preparation source bytes
        run: python -B -c "import hashlib,pathlib;print(hashlib.sha256(pathlib.Path('experiments/digital_pilot74_continuation_preflight_v1.py').read_bytes()).hexdigest())"
