name: Context90 focused source interface
on:
  push:
    branches: ['development/context90-packed-access-v2']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind source to retained narrow qualification
        run: python -B lab/check_context90_qualified_sources.py
      - name: Check only the new compact layout
        run: python -B -m unittest discover -s tests -p test_context90_layout_v3.py -v
