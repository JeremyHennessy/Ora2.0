name: AL02-COPY causal inheritance experiment
on:
  push:
    branches: [main, 'research/al02-executed-heredity']
    paths:
      - 'experiments/executed_heredity.py'
      - 'experiments/lineage_audit.py'
      - 'tests/test_executed_heredity.py'
      - 'docs/AL02-COPY-PROTOCOL.md'
      - '.github/workflows/al02-copy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audited-heritability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout independent experiment
        uses: actions/checkout@v4
      - name: Pin Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run all invariant and fraud-detection tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Run exactly 64 preregistered virtual-world seeds and four controls
        run: python -W error::ResourceWarning -m experiments.executed_heredity --seeds 5000:5064 --output-dir runs/al02-copy --source-revision "$GITHUB_SHA"
      - name: Archive every negative world and executed parent-write receipt
        uses: actions/upload-artifact@v4
        with:
          name: al02-copy-complete
          path: runs/al02-copy/
          retention-days: 90
