name: Prospective deadline qualification only
on:
  push:
    branches: ['implementation/pilot74-deadline-recovery-20261023']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Six new synthetic acceptance checks; no native or World execution
        run: python -B tests/test_pilot74_deadline_registration_v1.py
      - name: Exact inherited and added source bytes
        run: python -B -c "import json,hashlib,pathlib; p=json.loads(pathlib.Path('data/pilot74-deadline-source-pins-v1.json').read_text()); assert all(hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==h for n,h in p.items()); print(len(p),'source hashes matched')"
