name: PILOT74 new launcher failure and source checks
on:
  push:
    branches: ['implementation/safe-launcher-20261020', 'implementation/reboot-host-repair-20261022', 'implementation/remaining-root-accounting-20261022', 'implementation/bounded-memory-retrieval-20261022', 'implementation/maintenance-request-binding-20261022']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  new-launch-contract:
    runs-on: windows-latest
    # FULL-sync storage stress alone took 274s on a hosted Windows disk.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Check new launch and failure contracts without Ora imports
        run: python -B tests/test_digital_pilot74_launch_contract.py
      - name: Reject mismatched full-guardian native and start receipts
        run: python -B tests/test_pilot74_native_receipt_conformance.py
      - name: Full host protocol transcript and malformed peer responses
        run: python -B tests/test_pilot74_protocol_transcript.py
      - name: Durable bounded task stream including process crash and restart
        run: python -B tests/test_ora_task_store_v1.py
      - name: Real native service custody and bounded restart behavior
        run: python -B tests/test_ora_native_service_v1.py
      - name: Owned model endpoint identity and CPU-only policy refusal
        run: python -B tests/test_ora_owned_ollama_v1.py
      - name: Quarantine model guesses and authenticate operator corrections
        run: python -B tests/test_ora_trusted_feedback_v1.py
      - name: Bounded native memory retrieval and isolated control
        run: python -B tests/test_ora_memory_context_v1.py
      - name: Explicit bounded advisory maintenance request binding
        run: python -B tests/test_ora_maintenance_review_v1.py
      - name: Mixed task sources cannot overwrite operator input or self-approve reviews
        run: python -B tests/test_ora_mixed_stream_v1.py
      - name: Snapshot restoration requires closed owners and reconciled producer cursor
        run: python -B tests/test_ora_memory_restore_v1.py
      - name: Persistent controller budgets, simulated boot change and native shutdown
        run: python -B tests/test_ora_controller_v1.py
      - name: Prepared startup renewal, activation refusal and persistent failure hold
        run: python -B tests/test_ora_startup_preparation_v1.py
      - name: Cooperative reboot STOP, hard fallback and original error retention
        run: python -B tests/test_ora_reboot_stop_v1.py
      - name: Parse source dependency closure and check changed raw bytes
        run: python -B tests/pilot74_source_check.py
      - name: Select changed learning integration only
        id: scope
        shell: pwsh
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          $needed = $true
          if ($env:BEFORE -and $env:BEFORE -notmatch '^0+$') {
            $changed = git diff --name-only $env:BEFORE $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Cannot establish changed-source scope' }
            $needed = @($changed | Where-Object { $_ -match '^experiments/digital_(budgeted_transfer|context90|learning_restart)' -or $_ -eq 'tests/test_learning_restart_integration_v1.py' }).Count -gt 0
          }
          "learning=$($needed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: New authored learning checkpoint across actual process crash
        if: steps.scope.outputs.learning == 'true'
        run: python -B tests/test_learning_restart_integration_v1.py
