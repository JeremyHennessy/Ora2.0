name: PILOT74 empty capture authentication
on:
  push:
    branches: ['repair/pilot74-empty-capture-20261023']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  new_capture_regression:
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: New empty capture tests only, no qualification role or World execution
        run: python -B tests/test_pilot74_empty_capture_v1.py
      - name: Exact inherited source and modified guardian bytes
        run: python -B -c "import json,hashlib,pathlib; p=json.loads(pathlib.Path('data/pilot74-empty-capture-source-pins-v1.json').read_text()); assert all(hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==h for n,h in p.items()); print(len(p),'source hashes matched')"
