name: Closure reserve policy preparation
on:
  push:
    branches: ['implementation/pilot74-closure-reserve-20261023']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mocked:
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Thirteen mocked owner and reserve checks; no native or World execution
        run: python -B tests/test_pilot74_closure_reserve_v1.py
      - name: Exact source pins
        run: python -B -c "import json,hashlib,pathlib; p=json.loads(pathlib.Path('data/pilot74-closure-reserve-source-pins-v1.json').read_text()); assert all(hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==h for n,h in p.items()); print(len(p),'source hashes matched')"
