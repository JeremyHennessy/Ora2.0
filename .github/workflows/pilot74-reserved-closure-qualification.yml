name: Reserved closure qualification preparation
on:
  push:
    branches: ['implementation/pilot74-reserved-closure-qualification-20261023']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ten fresh qualification acceptance and lock tests, no native execution
        run: python -B tests/test_pilot74_reserved_closure_registration_v1.py
      - name: Fourteen closure policy mocked checks
        run: python -B tests/test_pilot74_closure_reserve_v1.py
      - name: Exact inherited policy and fresh caller source bytes
        run: python -B -c "import json,hashlib,pathlib; p=json.loads(pathlib.Path('data/pilot74-reserved-closure-source-pins-v1.json').read_text()); assert all(hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==h for n,h in p.items()); print(len(p),'source hashes matched')"
