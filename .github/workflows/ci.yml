name: Artificial-life laboratory tests
on:
  push:
    branches: [main, 'research/**']
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test deterministic AL01-CAL harness
        run: python -m unittest discover -s tests -v
