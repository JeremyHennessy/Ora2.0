name: Ora owned readiness repair
on:
  push:
    branches: ['repair/owned-readiness-evidence-20261024']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Readiness and owned policy regressions
        run: python -B -m unittest discover -s tests -p 'test_ora_owned*.py' -v
      - name: Controller closure and hold regressions
        run: python -B tests/test_ora_controller_v1.py
      - name: Whole-window budget regressions
        run: python -B tests/test_ora_window_close_budget_v1.py
      - name: Exact source hashes
        run: python -B -c "import json,hashlib,pathlib; p=json.loads(pathlib.Path('data/ora-readiness-source-pins-20261024.json').read_text()); assert all(hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()==h for n,h in p.items()); print(len(p),'hashes matched')"
