name: Budgeted transfer focused verification
on:
  push:
    branches: ['implementation/budgeted-transfer-reviewed']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  new-interface-and-independent-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify new interface and independent VM resource replay
        run: python -B -m unittest tests.test_digital_budgeted_transfer_v1 tests.test_digital_budgeted_transfer_replay_v1 -v
